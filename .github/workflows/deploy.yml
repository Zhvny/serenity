name: deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

# Hindari dua deploy balapan: batalkan run lama pada ref yang sama.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Hybrid B (2026-10-07): akun lab tak boleh register app Entra → tanpa OIDC.
# CI: verify + deploy frontend (token SWA). Backend MANUAL dari laptop
# (docker push + containerapp update + exec). Secrets yang dibutuhkan:
#   SWA_TOKEN           (deployment token Static Web Apps)
#   BACKEND_API_URL     (mis. https://serenity-be.xxx.azurecontainerapps.io/api/v1)
permissions:
  contents: read

jobs:
  # 0) Validasi workflow sendiri (actionlint) — tangkap error YAML/ekspresi lebih awal.
  lint-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # 1) Gate kualitas — WAJIB hijau sebelum build/deploy apa pun.
  verify:
    needs: lint-workflow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: serenity
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d serenity"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/serenity?sslmode=disable
      REDIS_URL: redis://localhost:6379
      FRONTEND_ORIGIN: http://localhost:5173
      QUASI_STATIC_QR_URL: https://qr.test/static
      ADMIN_USER: admin
      # Hash scrypt nyata (password 'benar123', salt 'testsalt12345678') agar assertAdminConfig lulus.
      ADMIN_PASS_HASH: testsalt12345678:cd0a979273bc96d883b17c1b922fd047b59a2377f8b864876cbb29804a4004e72eb4423da1d3b24ec2bf0762df1ce54341a515ed580251da94b4845827c2f78f
      INTERNAL_KEY: ci-internal-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # --- Backend ---
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Backend migrate (skema CI)
        working-directory: backend
        run: npm run migrate
      - name: Backend typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Backend audit (gate high)
        working-directory: backend
        run: npm audit --audit-level=high
      # --- Frontend ---
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend audit (gate high)
        working-directory: frontend
        run: npm audit --audit-level=high

  # 2) Frontend: build di runner (direct mode: VITE_API_URL absolut ke CA,
  #    karena linked-backend SWA<->CA 500 persisten) lalu upload ke SWA (skip Oryx build).
  deploy-frontend:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend (API direct ke CA)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.BACKEND_API_URL }}
        run: npm ci && npm run build
      - name: Deploy ke Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN }}
          action: upload
          app_location: "frontend/dist"
          skip_app_build: true
          output_location: ""
