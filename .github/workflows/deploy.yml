name: deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

# Hindari dua deploy balapan: batalkan run lama pada ref yang sama.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# OIDC ke Azure (tanpa password). Secrets yang dibutuhkan:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   ACR_NAME            (mis. acrserenity1234)              -- registry
#   RG                  (mis. rg-serenity-prod)
#   CA_BACKEND          (nama Container App backend)
#   MIGRATE_JOB         (nama Container Apps Job migrasi; dibuat di infra/azure.sh)
#   SWA_TOKEN           (deployment token Static Web Apps)
#   SMOKE_URL           (base URL backend publik, tanpa trailing slash)
permissions:
  id-token: write
  contents: read

jobs:
  # 0) Validasi workflow sendiri (actionlint) — tangkap error YAML/ekspresi lebih awal.
  lint-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # 1) Gate kualitas — WAJIB hijau sebelum build/deploy apa pun.
  verify:
    needs: lint-workflow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: serenity
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d serenity"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/serenity?sslmode=disable
      REDIS_URL: redis://localhost:6379
      FRONTEND_ORIGIN: http://localhost:5173
      QUASI_STATIC_QR_URL: https://qr.test/static
      ADMIN_USER: admin
      # Hash scrypt nyata (password 'benar123', salt 'testsalt12345678') agar assertAdminConfig lulus.
      ADMIN_PASS_HASH: testsalt12345678:cd0a979273bc96d883b17c1b922fd047b59a2377f8b864876cbb29804a4004e72eb4423da1d3b24ec2bf0762df1ce54341a515ed580251da94b4845827c2f78f
      INTERNAL_KEY: ci-internal-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # --- Backend ---
      - name: Backend install
        working-directory: backend
        run: npm ci
      - name: Backend migrate (skema CI)
        working-directory: backend
        run: npm run migrate
      - name: Backend typecheck
        working-directory: backend
        run: npx tsc --noEmit
      - name: Backend tests
        working-directory: backend
        run: npm test
      - name: Backend audit (gate high)
        working-directory: backend
        run: npm audit --audit-level=high
      # --- Frontend ---
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend typecheck + build
        working-directory: frontend
        run: npm run build
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend audit (gate high)
        working-directory: frontend
        run: npm audit --audit-level=high

  # 2) Build image backend DI ACR (az acr build) — tanpa docker login/push manual.
  build-backend:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR build (:sha + :latest)
        run: |
          az acr build --registry "${{ secrets.ACR_NAME }}" \
            --image "serenity-be:${{ github.sha }}" \
            --image "serenity-be:latest" \
            ./backend

  # 3) Migrasi (job terdaftar di azure.sh, role migrasi) -> rollout :sha -> smoke.
  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Jalankan migrasi (job sekali-jalan)
        run: |
          az containerapp job start \
            --name "${{ secrets.MIGRATE_JOB }}" --resource-group "${{ secrets.RG }}"
      - name: Rollout backend ke revisi :sha
        run: |
          az containerapp update \
            --name "${{ secrets.CA_BACKEND }}" --resource-group "${{ secrets.RG }}" \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/serenity-be:${{ github.sha }}" \
            --min-replicas 0 --max-replicas 3
      - name: Smoke /api/v1/health (200)
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.SMOKE_URL }}/api/v1/health" || true)
            if [ "$code" = "200" ]; then echo "health OK"; exit 0; fi
            echo "attempt $i -> $code"; sleep 6
          done
          echo "smoke gagal (health != 200)"; exit 1

  # 4) Frontend: build di runner (VITE_API_URL=/api/v1) lalu upload ke SWA (skip Oryx build).
  deploy-frontend:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build frontend (API satu domain)
        working-directory: frontend
        env:
          VITE_API_URL: /api/v1
        run: npm ci && npm run build
      - name: Deploy ke Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN }}
          action: upload
          app_location: "frontend/dist"
          skip_app_build: true
          output_location: ""
