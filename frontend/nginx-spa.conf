server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Aset ber-hash Vite: cache panjang + immutable.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: semua route (mis. /thanks?ref=, /status/:code, /admin) -> index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html jangan di-cache agar deploy baru langsung terlihat.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
